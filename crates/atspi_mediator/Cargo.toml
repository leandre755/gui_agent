[package]
name = "atspi-mediator"
version = "0.1.0"
edition = "2021"
authors = ["Leandre <leandre@example.com>"]
description = "High-performance AT-SPI2 / D-Bus accessibility mediation engine for Linux desktop"
license = "MIT"

[[bin]]
name = "gui-agent-atspi"
path = "src/main.rs"

[lib]
name = "atspi_mediator"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
atspi = { version = "0.29.0", default-features = false, features = ["proxies", "wrappers", "tokio"] }
atspi-connection = { version = "0.13.0", default-features = false, features = ["wrappers"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
zbus = "5.14.0"

[profile.release]
codegen-units = 1
opt-level = 3
lto = "fat"
strip = "symbols"
